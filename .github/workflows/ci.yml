# GitHub Actions CI for tunnelcat-ts.
#
# On every push to main, and on every PR:
#   1. Build the Go helper for 4 platforms (from the parked
#      Go repo at 0ArchLinux0/tunnelcat)
#   2. Run the TS unit + integration tests
#   3. Run the wire interop test (M0.7 gate)
#
# The wire interop test is the M0.7 gate. The cross-build is
# the M1.13 gate.

name: ci

on:
  push:
    branches: [main, "sess-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Go repo is at 0ArchLinux0/tunnelcat (parked). We clone
# it into ./go-src/ for the build steps. This is not a
# submodule (faster, simpler) — the Go repo is treated as a
# release-time dependency.
env:
  GO_REPO_URL: "https://github.com/0ArchLinux0/tunnelcat.git"
  GO_REPO_REF: "main"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: TS unit tests. Fast (< 1 min).
  # ─────────────────────────────────────────────────────────────
  ts-unit:
    name: ts (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

  # ─────────────────────────────────────────────────────────────
  # Job 2: Wire interop. The M0.7 gate.
  #
  # Clones the Go repo, builds the helper, then runs the
  # wire interop test using the freshly built helper.
  # ─────────────────────────────────────────────────────────────
  wire-interop:
    name: wire interop (M0.7 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone the Go repo
        run: git clone --depth 1 --branch "$GO_REPO_REF" "$GO_REPO_URL" go-src

      - name: Build the Rust crate
        working-directory: go-src/crates/tunnelcat-proto
        run: cargo build --release

      - name: Build the helper
        working-directory: go-src
        run: go build -o ../bin/tunnelcat-helper ./cmd/tunnelcat

      - name: Run wire interop test
        env:
          TUNNELCAT_GO_REPO: ${{ github.workspace }}/go-src
        run: npm run test:integration

  # ─────────────────────────────────────────────────────────────
  # Job 3: Cross-build the helper for 4 platforms.
  # The M1.13 gate.
  # ─────────────────────────────────────────────────────────────
  cross-build:
    name: cross-build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Clone the Go repo
        run: git clone --depth 1 --branch "$GO_REPO_REF" "$GO_REPO_URL" go-src

      - name: Build the helper (non-cgo)
        working-directory: go-src
        env:
          GOOS:   ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ${{ github.workspace }}/dist/cross-build
          go build -o ${{ github.workspace }}/dist/cross-build/tunnelcat-helper-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/tunnelcat
          ls -la ${{ github.workspace }}/dist/cross-build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/cross-build/tunnelcat-helper-${{ matrix.target.os }}-${{ matrix.target.arch }}

  # ─────────────────────────────────────────────────────────────
  # Job 4: Cross-build verification. Downloads each
  # cross-built helper and runs the wire interop test
  # against it. The M1.13 gate: if any platform's helper
  # doesn't work end-to-end, this fails.
  # ─────────────────────────────────────────────────────────────
  cross-verify:
    name: cross-verify (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: npm ci

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Download helper artifact
        uses: actions/download-artifact@v4
        with:
          name: helper-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/

      - name: Make executable + check binary
        run: |
          chmod +x bin/tunnelcat-helper-${{ matrix.target.os }}-${{ matrix.target.arch }}
          ls -la bin/
          file bin/tunnelcat-helper-${{ matrix.target.os }}-${{ matrix.target.arch }} 2>/dev/null || true

      - name: Verify the binary format matches the target
        # We can't run the cross-built arm64 or darwin binary
        # on the linux CI runner (different arch). Instead, we
        # inspect the ELF/Mach-O header directly.
        #   - ELF: e_machine at offset 18 is 0x3E (x86_64) or 0xB7 (aarch64)
        #   - Mach-O: cputype at offset 4 is 0x01000007 (x86_64) or 0x0100000C (arm64)
        run: |
          BIN="bin/tunnelcat-helper-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          MAGIC=$(head -c 4 "$BIN" | od -An -tx1 | tr -d ' \n')
          if [[ "$MAGIC" == "7f454c46" ]]; then
            # ELF (linux). e_machine at offset 18-19.
            E_MACHINE=$(head -c 20 "$BIN" | tail -c 2 | od -An -tx1 | tr -d ' \n')
            case "$E_MACHINE" in
              3e) ARCH="x86_64" ;;
              b7) ARCH="aarch64" ;;
              *)  echo "::error::unknown ELF e_machine: $E_MACHINE"; exit 1 ;;
            esac
            echo "✓ ELF binary, e_machine=$ARCH"
          elif [[ "$MAGIC" == "cffaedfe" || "$MAGIC" == "cefaedfe" ]]; then
            # Mach-O (darwin). cputype at offset 4-7.
            CPUTYPE=$(head -c 8 "$BIN" | tail -c 4 | od -An -tx1 | tr -d ' \n')
            case "$CPUTYPE" in
              01000007) ARCH="x86_64" ;;
              0100000c) ARCH="arm64"  ;;
              *)  echo "::error::unknown Mach-O cputype: $CPUTYPE"; exit 1 ;;
            esac
            echo "✓ Mach-O binary, cputype=$ARCH"
          else
            echo "::error::unknown binary format, magic=$MAGIC"; exit 1
          fi
          # Map binary arch to expected arch.
          if [[ "${{ matrix.target.arch }}" == "amd64" && "$ARCH" == "x86_64" ]]; then
            echo "✓ amd64 binary verified"
          elif [[ "${{ matrix.target.arch }}" == "arm64" && ("$ARCH" == "aarch64" || "$ARCH" == "arm64") ]]; then
            echo "✓ arm64 binary verified"
          else
            echo "::error::arch mismatch: expected ${{ matrix.target.arch }}, got $ARCH"
            exit 1
          fi

      - name: Run helper --help (linux only)
        # For linux/amd64 only — the linux/arm64 and darwin
        # binaries can't run on the linux CI runner.
        if: matrix.target.os == 'linux' && matrix.target.arch == 'amd64'
        run: bin/tunnelcat-helper-linux-amd64 --help
